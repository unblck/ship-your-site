# Publishes vscode-extension/ to the VS Code Marketplace and Open VSX without stored
# long-lived tokens (trusted publishing / OIDC). See PUBLISHING notes in the README.
#
# One-time setup (done by a human in the browser):
#   VS Code Marketplace: https://marketplace.visualstudio.com/manage -> publisher "unblck"
#     -> Trusted publishing -> GitHub Actions: owner "unblck", repository "ship-your-site",
#        workflow "publish-extension.yml", environment "release".
#   Open VSX (after the first PAT-based release and namespace verification):
#     https://open-vsx.org/user-settings -> Trusted Publishers -> namespace "unblck"
#        -> owner "unblck", repository "ship-your-site", workflow "publish-extension.yml",
#           environment "release".
#
# Run manually from the Actions tab, or push a tag like ext-v1.0.1
# (bump "version" in vscode-extension/package.json first).
name: publish-extension

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [both, vscode-marketplace, open-vsx]
        default: both
  push:
    tags:
      - "ext-v*"

permissions:
  contents: read

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  vscode-marketplace:
    if: github.event_name == 'push' || inputs.target != 'open-vsx'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publish to VS Code Marketplace (OIDC)
        run: npx --yes @vscode/vsce@4.0.1-3 publish --oidc --skip-duplicate

  open-vsx:
    if: github.event_name == 'push' || inputs.target != 'vscode-marketplace'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publish to Open VSX (trusted publishing)
        run: npx --yes ovsx@1.2.0 publish --trusted-publishing --skip-duplicate
